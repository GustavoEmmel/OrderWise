version: "3.8"

services:
  postgres:
    image: postgres:17
    container_name: orderwise-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: orderwise
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: orderwise-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
